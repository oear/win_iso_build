name: Experimental LTSC source and Windows audit

on:
  workflow_dispatch:
  push:
    branches: [experimental/ltsc-26340.9616]
    paths: ['experimental/**', 'tests/**', '.github/workflows/experimental_ltsc_audit.yml']

permissions:
  contents: read

concurrency:
  group: experimental-ltsc-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-audit:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate locked inputs and refusal cases
        run: python -m unittest discover -s tests -v
      - name: Parse every PowerShell file with both Windows PowerShell 5.1 and PowerShell 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parser = @'
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem experimental -Filter *.ps1) {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Format-List; throw ('Parser failed: ' + $file.Name) }
          }
          & experimental/Build-Ltsc.ps1
          $refused = $false
          try { & experimental/Build-Ltsc.ps1 -Apply } catch { $refused = $_.Exception.Message -match 'blocked by the manifest review gate' }
          if (-not $refused) { throw 'Research manifest failed to refuse offline servicing.' }
          '@
          New-Item -ItemType Directory -Path audit | Out-Null
          Set-Content audit/parse.ps1 $parser -Encoding UTF8
          & powershell.exe -NoProfile -File audit/parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell 5.1 smoke check failed.' }
          & pwsh -NoProfile -File audit/parse.ps1
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 7 smoke check failed.' }
      - name: Acquire the small EKB over validated HTTPS only
        run: python experimental/prepare.py acquire-packages --only-enablement --destination audit/packages
      - name: Check actual Microsoft catalogs under Windows default trust
        shell: pwsh
        run: |
          & experimental/Inspect-EnablementPackage.ps1 -PackagePath audit/packages/Windows11.0-KB5122776-x64.cab -OutputDirectory audit/enablement
      - name: Preserve evidence even if download or default trust rejects the package
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: experimental-ltsc-windows-audit
          path: |
            audit/enablement/*.json
            audit/enablement/*.log
            audit/parse.ps1
          if-no-files-found: warn
          retention-days: 30
